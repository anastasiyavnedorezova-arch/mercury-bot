# Тестовая среда Финника. Файл ставится скриптом setup-stage.sh в /etc/nginx/sites-available/finnik-stage
server {
    listen 80;
    server_name stage.finnikbot.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stage.finnikbot.ru;

    ssl_certificate     /etc/letsencrypt/live/stage.finnikbot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.finnikbot.ru/privkey.pem;

    # Тестовую среду не должны находить поисковики
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
