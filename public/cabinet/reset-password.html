<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Финник — Новый пароль</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon-finnik.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png">
  <link rel="manifest" href="/cabinet/manifest.json">
  <meta name="theme-color" content="#1E2A38">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Финник">
  <link rel="apple-touch-icon" href="/images/bot-app-icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/images/bot-app-icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/images/bot-app-icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/bot-app-icon-180.png">
  <link rel="preload" href="/fonts/manrope/manrope-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/manrope/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Manrope', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background-color: #FCE8E8;
    }

    /* ══════════════════════════════════
       CARD
    ══════════════════════════════════ */
    .card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 24px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .card__body {
      padding: 28px 32px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card__title {
      font-size: 24px;
      font-weight: 600;
      color: #2D3748;
      line-height: 32px;
      text-align: center;
    }

    /* ── Panels ── */
    .panel { display: none; flex-direction: column; gap: 20px; }
    .panel.is-active { display: flex; }

    /* ── Fields ── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field__input {
      width: 100%;
      padding: 10px 14px;
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: #2D3748;
      line-height: 24px;
      background: #fff;
      border: 1px solid #CBD5E1;
      border-radius: 12px;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }
    .field__input::placeholder { color: #9CA3AF; }
    .field__input:focus {
      border-color: #4C9AFF;
      box-shadow: 0 0 0 3px rgba(76,154,255,0.15);
    }
    .field__input.is-error {
      background: #FDECEC;
      border-color: #E5484D;
    }
    .field__hint {
      font-size: 12px;
      font-weight: 500;
      color: #9B2C2C;
      line-height: 16px;
      padding: 0 14px;
      display: none;
    }
    .field__hint.is-visible { display: block; }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      height: 44px;
      padding: 10px 20px;
      border-radius: 12px;
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
      letter-spacing: 0.14px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 150ms ease, opacity 150ms ease;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn--primary { background: #4C9AFF; color: #fff; }
    .btn--primary:hover { background: #3B82F6; }
    .btn--primary:active { background: #2563EB; }
    .btn--primary:disabled { background: #EEF2F6; color: #9CA3AF; cursor: not-allowed; }
    .btn--dark { background: #1E2A38; color: #fff; border-radius: 12px; }
    .btn--dark:hover { background: #2D3748; }
    .btn--dark:disabled { background: #EEF2F6; color: #9CA3AF; cursor: not-allowed; }

    /* ── Helper text ── */
    .helper-text {
      font-size: 14px;
      font-weight: 400;
      color: #4B5563;
      line-height: 20px;
    }

    /* ══════════════════════════════════
       TOAST
    ══════════════════════════════════ */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      opacity: 0;
      transition: transform 300ms ease, opacity 300ms ease;
      background: #1E2A38;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      border-radius: 12px;
      padding: 12px 20px;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
    }
    .toast.is-visible { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ══════════════════════════════════
       MOBILE
    ══════════════════════════════════ */
    @media (max-width: 520px) {
      body { padding: 0; align-items: flex-start; background-color: #fff; }
      .card { border-radius: 0; border: none; box-shadow: none; max-width: 100%; min-height: 100vh; }
      .card__body { padding: 24px 20px 40px; }
      .card__title { font-size: 22px; }
    }
  </style>
</head>
<body id="pageBody">
  <div class="card">
    <div class="card__body">

      <!-- ── PANEL: FORM ── -->
      <div class="panel is-active" id="panelForm">
        <div class="card__title" style="text-align:left;">Новый пароль</div>

        <div style="display:flex;flex-direction:column;gap:8px;">
          <p class="helper-text" style="color:#6B7280;font-size:14px;">Придумайте новый пароль для входа в личный кабинет.</p>
          <div class="field">
            <input class="field__input" id="newPassword" type="password" autocomplete="new-password" placeholder="Новый пароль"/>
            <span class="field__hint" id="newPasswordHint"></span>
          </div>
          <div class="field">
            <input class="field__input" id="newPassword2" type="password" autocomplete="new-password" placeholder="Повторите пароль"/>
            <span class="field__hint" id="newPassword2Hint"></span>
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end;">
          <button class="btn btn--dark" id="btnSetPassword" style="width:auto;padding:10px 20px;height:40px;font-size:14px;border-radius:10px;">Сохранить пароль</button>
        </div>
      </div>

      <!-- ── PANEL: SUCCESS ── -->
      <div class="panel" id="panelOk">
        <div style="text-align:center;padding:24px 0;display:flex;flex-direction:column;align-items:center;gap:16px;">
          <div style="font-size:48px;">✅</div>
          <div class="card__title">Пароль изменён</div>
          <p class="helper-text" style="text-align:center;color:#6B7280;">Теперь можно войти с новым паролем.</p>
          <a class="btn btn--primary" href="/cabinet/login?reset=ok" style="margin-top:8px;">Войти</a>
        </div>
      </div>

      <!-- ── PANEL: INVALID LINK ── -->
      <div class="panel" id="panelInvalid">
        <div style="text-align:center;padding:24px 0;display:flex;flex-direction:column;align-items:center;gap:16px;">
          <div style="font-size:48px;">⚠️</div>
          <div class="card__title">Ссылка устарела</div>
          <p class="helper-text" style="text-align:center;color:#6B7280;">Ссылка недействительна или уже использована. Запросите новое письмо.</p>
          <a class="btn btn--primary" href="/cabinet/login" style="margin-top:8px;">Вернуться ко входу</a>
        </div>
      </div>

    </div><!-- /card__body -->
  </div><!-- /card -->

  <!-- Toast -->
  <div class="toast" id="toast"></div>

<script>
  // Recovery token lives in memory only — never in localStorage/sessionStorage
  let recoveryToken = null;

  const panelForm    = document.getElementById('panelForm');
  const panelOk      = document.getElementById('panelOk');
  const panelInvalid = document.getElementById('panelInvalid');
  const toast        = document.getElementById('toast');

  function showPanel(name) {
    [panelForm, panelOk, panelInvalid].forEach(p => p.classList.remove('is-active'));
    if (name === 'form')    panelForm.classList.add('is-active');
    if (name === 'ok')      panelOk.classList.add('is-active');
    if (name === 'invalid') panelInvalid.classList.add('is-active');
  }

  function showToast(msg, duration = 3000) {
    toast.textContent = msg;
    toast.classList.add('is-visible');
    setTimeout(() => toast.classList.remove('is-visible'), duration);
  }

  function setErr(input, hint, msg) {
    input.classList.add('is-error');
    hint.textContent = msg;
    hint.classList.add('is-visible');
  }
  function clearErr(input, hint) {
    input.classList.remove('is-error');
    hint.classList.remove('is-visible');
    hint.textContent = '';
  }

  // ── Read and consume the URL hash on page load ────────────
  (function handleRecovery() {
    const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const token = hash.get('token');

    // Immediately strip secrets from address bar
    if (window.location.hash) {
      history.replaceState(null, '', window.location.pathname);
    }

    if (token && /^[0-9a-f]{64}$/.test(token)) {
      recoveryToken = token;
      showPanel('form');
      return;
    }

    // No valid token (direct navigation, old-format or broken link)
    showPanel('invalid');
  })();

  // ── Set password ──────────────────────────────────────────
  const newPasswordField  = document.getElementById('newPassword');
  const newPasswordHint   = document.getElementById('newPasswordHint');
  const newPassword2Field = document.getElementById('newPassword2');
  const newPassword2Hint  = document.getElementById('newPassword2Hint');

  document.getElementById('btnSetPassword').addEventListener('click', async () => {
    clearErr(newPasswordField, newPasswordHint);
    clearErr(newPassword2Field, newPassword2Hint);

    const pw1 = newPasswordField.value;
    const pw2 = newPassword2Field.value;

    if (!pw1) { setErr(newPasswordField, newPasswordHint, 'Обязательное поле'); return; }
    if (pw1.length < 6) { setErr(newPasswordField, newPasswordHint, 'Минимум 6 символов'); return; }
    if (!pw2) { setErr(newPassword2Field, newPassword2Hint, 'Обязательное поле'); return; }
    if (pw1 !== pw2) { setErr(newPassword2Field, newPassword2Hint, 'Пароли не совпадают'); return; }

    if (!recoveryToken) {
      showPanel('invalid');
      return;
    }

    const btn = document.getElementById('btnSetPassword');
    btn.disabled = true;
    btn.textContent = 'Сохраняем…';

    try {
      const res = await fetch('/api/auth/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: recoveryToken, password: pw1 })
      });
      let data = {};
      try { data = await res.json(); } catch {}

      if (res.ok) {
        recoveryToken = null;
        newPasswordField.value = '';
        newPassword2Field.value = '';
        showPanel('ok');
      } else {
        btn.disabled = false;
        btn.textContent = 'Сохранить пароль';
        if (res.status === 429) {
          setErr(newPassword2Field, newPassword2Hint, 'Слишком много попыток. Попробуйте позже.');
        } else if (data.error === 'invalid_token') {
          recoveryToken = null;
          showPanel('invalid');
        } else if (data.error === 'validation') {
          setErr(newPasswordField, newPasswordHint, data.message || 'Некорректный пароль');
        } else {
          setErr(newPassword2Field, newPassword2Hint, 'Не удалось сохранить пароль. Попробуйте ещё раз.');
        }
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Сохранить пароль';
      setErr(newPassword2Field, newPassword2Hint, 'Не удалось сохранить пароль. Попробуйте ещё раз.');
    }
  });
</script>
</body>
</html>
