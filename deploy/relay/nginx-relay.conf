# Ретранслятор Telegram и OpenAI (relay.finnikbot.ru): файл /etc/nginx/sites-enabled/relay (копия боевого, без секретов).
# Пускает только основной сервер; всё остальное закрыто. Ключи OpenAI и токены Telegram идут в запросах клиента, здесь их нет.
server {
    listen 80;
    listen [::]:80;
    server_name relay.finnikbot.ru;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name relay.finnikbot.ru;
    ssl_certificate     /etc/letsencrypt/live/relay.finnikbot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.finnikbot.ru/privkey.pem;
    allow 129.101.119.154;   # основной сервер (прод и stage). Если он переедет — поменять здесь
    deny all;
    error_log /var/log/nginx/relay_error.log crit;
    client_max_body_size 25m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_buffering off;
    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    location /telegram/ {
        access_log off;
        proxy_pass https://api.telegram.org/;
        proxy_set_header Host api.telegram.org;
    }
    location /openai/ {
        proxy_pass https://api.openai.com/;
        proxy_set_header Host api.openai.com;
    }
    location / {
        return 404;
    }
}
