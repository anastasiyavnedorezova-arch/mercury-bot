<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mercury — Чат с ботом</title>
  <link rel="manifest" href="/cabinet/bot-manifest.json">
  <meta name="theme-color" content="#1E2A38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mercury">
  <link rel="apple-touch-icon" href="/images/bot-app-icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/images/bot-app-icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/images/bot-app-icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/bot-app-icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/bot-app-icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden}
body{font-family:'Manrope',sans-serif;background:#F5F7FA;margin:0;overflow:hidden}

/* ══════ LAYOUT ══════ */
.page-layout{display:flex;position:fixed;inset:0;width:100%;overflow:hidden}



/* ══════ CSS VARS ══════ */
:root{
  --color-brand-primary:#4C9AFF;
  --color-brand-primary-hover:#3B82F6;
  --color-brand-main:#1E2A38;
  --color-white:#FFFFFF;
  --color-bg-main:#F5F7FA;
  --color-bg-alt:#EEF2F6;
  --color-border:#E2E8F0;
  --color-border-hard:#CBD5E1;
  --color-text-main:#2D3748;
  --color-text-second:#6B7280;
  --color-text-disabled:#9CA3AF;
  --font:'Manrope',sans-serif;
  --radius-bubble:18px;
  --radius-cta:10px;
}

/* ══════ BOT PAGE LAYOUT ══════ */
.bot-page{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--color-bg-main)}
.bot-chat-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;border-bottom:1px solid var(--color-border);background:#fff;flex-shrink:0}
.bot-chat-header__info{display:flex;align-items:center;gap:12px;min-width:0}
.bot-close-btn{width:36px;height:36px;border-radius:50%;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background 150ms}
.bot-close-btn:hover{background:#F3F4F6}
.bot-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0}
.bot-name{font-size:16px;font-weight:600;color:var(--color-text-main)}
.bot-status{font-size:12px;font-weight:500;color:#22C55E}

/* ══════ CHAT AREA ══════ */
.chat-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;display:flex;flex-direction:column;gap:0;scroll-behavior:smooth;background:var(--color-bg-main)}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:4px}

/* ══════ BUBBLES ══════ */
.bubble-wrap{display:flex;flex-direction:column;margin-bottom:10px}
.bubble-wrap.from-bot{align-items:flex-start}
.bubble-wrap.from-user{align-items:flex-end}
.bubble{position:relative;padding:8px 14px;border-radius:var(--radius-bubble);font-size:14px;font-weight:400;line-height:20px;max-width:85%;word-break:break-word;white-space:pre-wrap}
.bubble.bot{background:var(--color-bg-alt);color:var(--color-text-main);border-bottom-left-radius:4px}
.bubble.user{background:var(--color-brand-primary);color:#fff;border-bottom-right-radius:4px}
.bubble.bot::before{content:'';position:absolute;left:-8px;bottom:6px;width:0;height:0;border-top:10px solid transparent;border-right:10px solid var(--color-bg-alt);border-bottom:0 solid transparent}
.bubble.user::before{content:'';position:absolute;right:-8px;bottom:6px;width:0;height:0;border-top:10px solid transparent;border-left:10px solid var(--color-brand-primary);border-bottom:0 solid transparent}

/* ══════ CTA BUTTONS ══════ */
.cta-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;padding-left:0}
.cta-btn{height:40px;padding:10px 16px;background:var(--color-white);border:1px solid var(--color-border);border-radius:var(--radius-cta);font-family:var(--font);font-size:14px;font-weight:600;line-height:20px;color:var(--color-text-main);cursor:pointer;white-space:nowrap;transition:background 150ms,border-color 150ms}
.cta-btn:hover{background:var(--color-bg-alt);border-color:var(--color-border-hard)}
.cta-btn:active{transform:scale(.98)}

/* ══════ INPUT BAR ══════ */
.input-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-shrink:0;border-top:1px solid var(--color-border);background:#fff}
.chat-input{flex:1;padding:10px 14px;background:#fff;border:1px solid var(--color-border-hard);border-radius:12px;font-family:var(--font);font-size:16px;font-weight:400;line-height:24px;color:var(--color-text-main);outline:none;transition:border-color 200ms,box-shadow 200ms;resize:none}
.chat-input::placeholder{color:var(--color-text-disabled)}
.chat-input:focus{border-color:var(--color-brand-primary);box-shadow:0 0 0 3px rgba(76,154,255,.15)}
.send-btn{width:44px;height:44px;border-radius:50%;background:var(--color-brand-primary);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0;transition:background 150ms}
.send-btn:hover{background:var(--color-brand-primary-hover)}
.send-btn:disabled{background:var(--color-bg-alt);cursor:default}
.send-btn svg{display:block}
.input-icon-btn{width:44px;height:44px;border-radius:50%;background:#EAF2FF;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background 150ms}
.input-icon-btn:hover{background:#D8E8FF}
.input-icon-btn img{display:block;width:24px;height:24px}

/* ══════ TYPING INDICATOR ══════ */
.typing-wrap{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:10px}
.typing-indicator{display:flex;align-items:center;gap:4px;padding:10px 14px;background:var(--color-bg-alt);border-radius:18px;border-bottom-left-radius:4px;width:fit-content}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--color-text-second);animation:blink 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ══════ RESPONSIVE ══════ */
@media (max-width: 768px){
  .chat-input{font-size:16px}
}

@media (min-width: 901px) {
  body {
    background: rgba(0, 0, 0, 0.4);
  }
  .page-layout {
    align-items: center;
    justify-content: flex-end;
    padding: 40px 40px 40px 0;
    background: transparent;
  }
  .bot-page {
    width: 530px;
    max-width: 530px;
    height: calc(100vh - 80px);
    height: calc(100dvh - 80px);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }
  .bot-chat-header {
    border-radius: 20px 20px 0 0;
  }
}
  </style>
</head>
<body>


<!-- PAGE -->
<div class="page-layout">


  <!-- MAIN: CHAT -->
  <main class="bot-page">
    <div class="bot-chat-header">
      <div class="bot-chat-header__info">
        <img src="/images/bot-face.svg" class="bot-avatar" alt="Mercury Bot"/>
        <div>
          <div class="bot-name">Меркури</div>
          <div class="bot-status">онлайн</div>
        </div>
      </div>
      <button class="bot-close-btn" id="botCloseBtn" aria-label="Закрыть чат">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6L18 18" stroke="#4B5563" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-bar">
      <button class="input-icon-btn" id="botMenuBtn" aria-label="Главное меню">
        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cGF0aCBkPSJNNCA2SDIwTTQgMTJIMjBNNCAxOEgyMCIgc3Ryb2tlPSIjNEM5QUZGIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjwvc3ZnPg==" width="24" height="24" alt=""/>
      </button>

      <input class="chat-input" id="chatInput" type="text" placeholder="Написать сообщение..." autocomplete="off"/>
      <button class="send-btn" id="sendBtn" aria-label="Отправить">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </main>

</div>
<!-- /PAGE -->



<script type="module">
import { getToken, authHeaders } from './layout.js';

// ── Chat state ─────────────────────────────────────────────────────────────
let isPolling = false;

// ── Init chat ──────────────────────────────────────────────────────────────
async function initChat() {
  try {
    const res = await fetch('/api/bot/init', { method: 'POST', headers: authHeaders() });
    if (!res.ok) return;
    const data = await res.json();
    if (data.ok && data.messages) {
      renderMessages(data.messages);
    }
    startPolling();
  } catch(e) {
    console.error('[bot] initChat error:', e);
  }
}

// ── Polling ────────────────────────────────────────────────────────────────
function startPolling() {
  if (isPolling) return;
  isPolling = true;
  pollLoop();
}

async function pollLoop() {
  while (isPolling) {
    try {
      const res = await fetch('/api/bot/poll', { headers: authHeaders() });
      if (res.status === 401) { window.location.href = '/cabinet/login'; return; }
      if (!res.ok) throw new Error('poll failed: ' + res.status);
      const data = await res.json();
      if (data.messages?.length) {
        renderMessages(data.messages);
      }
    } catch(e) {
      console.warn('[bot] poll retry after error:', e.message);
      await new Promise(r => setTimeout(r, 2000));
    }
  }
}

// При возврате вкладки в фокус следующая итерация pollLoop
// переподключится автоматически после catch+sleep
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && isPolling) {
    // pollLoop продолжает свой цикл — дополнительных действий не требуется
  }
});

// ── Render messages ────────────────────────────────────────────────────────
function removeTyping() {
  document.querySelectorAll('.typing-wrap').forEach(el => el.remove());
}

function renderMessages(messages) {
  removeTyping();
  const area = document.getElementById('chatArea');
  for (const msg of messages) {
    if (msg.type !== 'message' && msg.type !== 'edit') continue;
    const text = msg.text || '';
    const keyboard = msg.opts?.reply_markup?.inline_keyboard || [];

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap from-bot';
    const bubble = document.createElement('div');
    bubble.className = 'bubble bot';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    area.appendChild(wrap);

    if (keyboard.length > 0) {
      const ctaWrap = document.createElement('div');
      ctaWrap.className = 'cta-wrap';
      for (const row of keyboard) {
        for (const btn of row) {
          const b = document.createElement('button');
          b.className = 'cta-btn msg-inline-btn';
          b.textContent = btn.text;
          b.callback_data = btn.callback_data || '';
          b.onclick = () => handleInlineButton(b);
          ctaWrap.appendChild(b);
        }
      }
      area.appendChild(ctaWrap);
    }
  }
  area.scrollTop = area.scrollHeight;
}

// ── Send message ───────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const area = document.getElementById('chatArea');

  // User bubble
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap from-user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble user';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  area.appendChild(wrap);

  // Typing indicator
  const typingId = 'typingIndicator-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  const typingWrap = document.createElement('div');
  typingWrap.className = 'typing-wrap';
  typingWrap.id = typingId;
  typingWrap.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  area.appendChild(typingWrap);
  area.scrollTop = area.scrollHeight;

  try {
    await fetch('/api/bot/send', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ text }),
    });
  } catch(e) {
    console.error('[bot] sendMessage error:', e);
    removeTyping();
  }
}

// ── Inline button handler ──────────────────────────────────────────────────
async function handleInlineButton(btn) {
  // Блокируем все inline-кнопки чтобы избежать повторных нажатий
  document.querySelectorAll('.msg-inline-btn').forEach(b => { b.disabled = true; });

  const area = document.getElementById('chatArea');

  // Показываем нажатую кнопку как пузырь пользователя, убираем клавиатуру
  const ctaWrap = btn.closest('.cta-wrap');
  if (ctaWrap) ctaWrap.remove();

  const uWrap = document.createElement('div');
  uWrap.className = 'bubble-wrap from-user';
  const uBubble = document.createElement('div');
  uBubble.className = 'bubble user';
  uBubble.textContent = btn.textContent;
  uWrap.appendChild(uBubble);
  area.appendChild(uWrap);

  // Показываем индикатор печати
  const typingId = 'typingIndicator-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  const typingWrap = document.createElement('div');
  typingWrap.className = 'typing-wrap';
  typingWrap.id = typingId;
  typingWrap.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  area.appendChild(typingWrap);
  area.scrollTop = area.scrollHeight;

  try {
    const res = await fetch('/api/bot/callback', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ callback_data: btn.callback_data }),
    });
    if (res.status === 401) { window.location.href = '/cabinet/login'; return; }
    const data = await res.json();
    if (data.messages?.length) {
      renderMessages(data.messages);
    } else {
      removeTyping();
    }
  } catch(e) {
    console.error('[bot] callback error:', e);
    removeTyping();
  }
}

// ── Event listeners ────────────────────────────────────────────────────────
document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
document.getElementById('botCloseBtn').addEventListener('click', () => {
  if (document.referrer && new URL(document.referrer).origin === location.origin) {
    history.back();
  } else {
    window.location.href = '/cabinet/dashboard';
  }
});
document.getElementById('botMenuBtn').addEventListener('click', () => {
  const fakeBtn = document.createElement('button');
  fakeBtn.textContent = '☰ Главное меню';
  fakeBtn.callback_data = 'menu:main';
  handleInlineButton(fakeBtn);
});

// ── Start ──────────────────────────────────────────────────────────────────
initChat();
</script>
</body>
</html>
